<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b18" />
    <meta name="description" content="Balls — a tiny bouncing physics playground." />
    <title>Balls — Physics Playground</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Balls home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-copy">
            <strong>BALLS</strong>
            <small>bouncing physics playground</small>
          </span>
        </a>
        <div class="topbar-meta">
          <span class="pill pill-live"><span class="dot"></span>Live</span>
          <span class="pill" id="clock">00:00</span>
        </div>
      </header>

      <main class="stage" id="stage">
        <canvas id="scene" aria-label="Animated canvas with colorful bouncing balls"></canvas>

        <div class="hud hud-left" aria-hidden="true">
          <span class="hud-label">Balls</span>
          <strong id="ball-count">18</strong>
        </div>
        <div class="hud hud-right" aria-hidden="true">
          <span class="hud-label">FPS</span>
          <strong id="fps">60</strong>
        </div>

        <div class="stage-title" aria-hidden="true">
          <span>Drop. Bounce. Repeat.</span>
        </div>
      </main>

      <footer class="toolbar">
        <p class="hint">Tap the stage to drop a ball</p>
        <div class="actions">
          <button type="button" id="add" class="button button-primary">Add 5</button>
          <button type="button" id="gravity" class="button" aria-pressed="true">Gravity</button>
          <button type="button" id="reset" class="button">Reset</button>
        </div>
      </footer>
    </div>
  </body>
</html>
